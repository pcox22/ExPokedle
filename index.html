<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokedleEX - Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hub-styles.css">
  <link rel="icon" href="images/favicon.png" type="image/png">
</head>

<body>
  <div class="hub-container">
    <div class="hub-header">
      <img src="images/PokedleLogo.png" alt="PokedleEX Logo"/>
      <h1>PokedleEX</h1>
      <p>Guess the Pokémon. Every day, a new challenge!</p>
    </div>

    <div class="games-grid">
      <a href="game.html" class="game-card">
        <h3>🎮 Gen 1</h3>
        <p>Kanto Region</p>
        <p style="font-size: 0.8rem;">#1-151</p>
      </a>

      <div class="game-card coming-soon">
        <h3>🎮 Gen 2</h3>
        <p>Johto Region</p>
        <p style="font-size: 0.8rem;">#152-251</p>
        <span class="badge">Coming Soon</span>
      </div>

      <div class="game-card coming-soon">
        <h3>🎮 Gen 3</h3>
        <p>Hoenn Region</p>
        <p style="font-size: 0.8rem;">#252-386</p>
        <span class="badge">Coming Soon</span>
      </div>

      <div class="game-card coming-soon">
        <h3>🎮 Custom</h3>
        <p>Choose Your Challenge</p>
        <p style="font-size: 0.8rem;">Mix & Match</p>
        <span class="badge">Coming Soon</span>
      </div>
    </div>
  </div>
</body>

</html>
